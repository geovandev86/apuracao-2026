<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 2026</title>
<style>
  :root {
    --fundo: #f3f4f7; --cartao: #ffffff; --texto: #15181d; --suave: #5f6b7a; --linha: #e2e6ec;
    --lider: #1d4ed8; --segundo: #0f766e; --barra: #a3acb9; --trilho: #eceff3;
    --ok: #15803d; --alerta: #b45309; --erro: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #0f1115; --cartao: #181b21; --texto: #e9ebef; --suave: #9aa4b2; --linha: #2a2f38;
      --lider: #7aa7ff; --segundo: #42cdb9; --barra: #5d6675; --trilho: #252a33;
      --ok: #4ade80; --alerta: #fbbf24; --erro: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; color: #fff; background: linear-gradient(90deg, #0a3fa8, #00913a); border-bottom: 4px solid #ffd500; }
  header .meta { color: rgba(255, 255, 255, .9); }
  header select { color: #fff; background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .45); }
  header option { color: #15181d; background: #fff; }
  header button { color: #1a1a00; background: #ffd500; border-color: #ffd500; }
  header button:hover { background: #ffe44d; border-color: #ffe44d; }
  .topo { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { font-size: 19px; margin: 0; }
  h2 { font-size: 17px; margin: 0; padding-left: 9px; border-left: 5px solid #ffd500; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: rgba(0, 0, 0, .28); }
  .status i { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .status.andando { background: #ffd500; color: #1a1a00; }
  .status.andando i { background: #e11d48; animation: pisca 1s infinite; }
  .status.fim { background: #fff; color: #0a3fa8; }
  .status.fim i { background: #00913a; }
  @keyframes pisca { 50% { opacity: .25; } }
  .espaco { flex: 1; }
  .meta { color: var(--suave); font-size: 13px; font-variant-numeric: tabular-nums; }
  select, button, input { font: inherit; color: var(--texto); background: var(--cartao); border: 1px solid var(--linha); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; font-weight: 600; }
  button:hover, select:hover { border-color: var(--suave); }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 16px; min-width: 0; }
  .larga { grid-column: 1 / -1; }
  .cab { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
  .cab select { max-width: 100%; }
  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .resumo div { background: color-mix(in srgb, var(--cor) 13%, var(--cartao)); border-left: 5px solid var(--cor); border-radius: 8px; padding: 8px 10px; }
  .resumo span { display: block; color: var(--suave); font-size: 12px; }
  .resumo strong { font-size: 19px; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--cor) 72%, var(--texto)); }
  .resumo small { display: block; color: var(--suave); font-size: 12px; font-variant-numeric: tabular-nums; }
  .progresso { height: 12px; background: var(--trilho); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .progresso i { display: block; height: 100%; background: linear-gradient(90deg, #00b84a, #ffd500); transition: width .6s; }
  ol.cands { list-style: none; margin: 0; padding: 0; }
  .cand { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-top: 1px solid var(--linha); border-radius: 10px; }
  .cand:first-child { border-top: 0; }
  .cand.frente { background: color-mix(in srgb, var(--cor) 16%, transparent); border-top-color: transparent; box-shadow: inset 5px 0 0 var(--cor); }
  .cand.frente + .cand { border-top-color: transparent; }
  .foto { width: 50px; height: 60px; object-fit: cover; border-radius: 8px; background: var(--trilho); border: 3px solid var(--cor); }
  .nome { font-weight: 700; }
  .partido { color: var(--suave); font-size: 13px; }
  .selo { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--ok); color: var(--ok); margin-left: 6px; white-space: nowrap; }
  .barra { position: relative; height: 14px; background: var(--trilho); border-radius: 99px; margin-top: 5px; }
  .barra i { display: block; height: 100%; border-radius: 99px; background: var(--cor); transition: width .6s; }
  .barra b { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--texto); opacity: .45; }
  .nums { text-align: right; font-variant-numeric: tabular-nums; }
  .nums strong { display: block; font-size: 21px; color: color-mix(in srgb, var(--cor) 65%, var(--texto)); }
  .nums span { color: var(--suave); font-size: 12px; }
  .nota { color: var(--suave); font-size: 12px; margin: 10px 0 0; }
  .aviso { color: var(--suave); padding: 14px 0; }
  .aviso.falha { color: var(--erro); }
  .rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--suave); font-size: 12px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--fundo); }
  .mini { display: inline-block; vertical-align: middle; width: 70px; height: 6px; background: var(--trilho); border-radius: 99px; overflow: hidden; margin-right: 8px; }
  .mini i { display: block; height: 100%; background: linear-gradient(90deg, #00b84a, #ffd500); }
  .ponto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; background: var(--cor); }
  /* Candidato com as cores da bandeira: verde, amarelo e azul em faixas. */
  .bandeira { --faixas: #009c3b 0 42%, #ffdf00 42% 72%, #0033a0 72%; }
  .bandeira .barra i, .ponto.bandeira { background: linear-gradient(90deg, var(--faixas)); }
  .bandeira .foto { border: 0; padding: 3px; background: linear-gradient(160deg, var(--faixas)); }
  .cand.frente.bandeira { box-shadow: none; background: linear-gradient(180deg, var(--faixas)) left / 5px 100% no-repeat, color-mix(in srgb, var(--cor) 16%, transparent); }
  .c1 { font-weight: 700; }
  .c2 { font-weight: 600; }
  button.nome { border: 0; background: none; padding: 0; color: inherit; font-weight: 700; text-align: left; cursor: pointer; }
  button.nome:hover { text-decoration: underline; }
  .cand { cursor: pointer; }
  .cand:hover { background: color-mix(in srgb, var(--cor) 9%, transparent); }
  dialog { border: 0; padding: 0; border-radius: 14px; background: var(--cartao); color: var(--texto); width: min(580px, calc(100% - 24px)); max-height: calc(100% - 32px); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .fTopo { display: flex; gap: 14px; align-items: center; padding: 16px; border-top: 7px solid var(--cor); background: color-mix(in srgb, var(--cor) 14%, var(--cartao)); }
  .fTopo.bandeira { border-image: linear-gradient(90deg, var(--faixas)) 1; }
  .fTopo .foto { width: 84px; height: 104px; flex: none; }
  .fTopo > div { flex: 1; min-width: 0; }
  .fTopo h3 { margin: 0; font-size: 21px; }
  .fTopo .selo { margin: 6px 0 0; display: inline-block; }
  .fFechar { align-self: flex-start; flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%; }
  .fCorpo { display: grid; gap: 14px; padding: 14px 16px 16px; }
  .fCorpo h4 { margin: 0; font-size: 14px; }
  .fNums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fNums div { background: var(--fundo); border-radius: 8px; padding: 8px 10px; }
  .fNums span { display: block; color: var(--suave); font-size: 12px; }
  .fNums strong { font-size: 19px; font-variant-numeric: tabular-nums; }
  .fDados { display: grid; gap: 8px; margin: 0; }
  .fDados > div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
  .fDados dt { color: var(--suave); font-size: 13px; }
  .fDados dd { margin: 0; }
  .fVice { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .fVice img { flex: none; width: 32px; height: 40px; object-fit: cover; border-radius: 5px; background: var(--trilho); }
  .fCorpo tbody tr { cursor: default; }
  .fCorpo a { color: color-mix(in srgb, var(--lider) 80%, var(--texto)); }
  /* Celular: o topo deixa de ficar preso na tela e a ficha ganha mais espaço para o texto. */
  @media (max-width: 600px) {
    header { position: static; }
    main { padding: 10px; gap: 10px; }
    section { padding: 12px; }
    dialog { width: calc(100% - 16px); max-height: calc(100% - 16px); }
    .fTopo { padding: 12px; gap: 10px; }
    .fTopo .foto { width: 68px; height: 84px; }
    .fTopo h3 { font-size: 18px; }
    .fCorpo { padding: 12px; }
    .fNums strong { font-size: 16px; }
    .fDados > div { grid-template-columns: 84px minmax(0, 1fr); }
  }

  /* Modo monitor: uma tela só, sem rolagem, com tudo dimensionado pelo tamanho da tela (unidade em). */
  #monitor { position: fixed; inset: 0; z-index: 50; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .9em; padding: 1.1em 1.5em;
    --fundo: #0a0c11; --cartao: #141821; --texto: #f3f5f9; --suave: #a7b1c0; --linha: #2a303b; --trilho: #252b36;
    background: var(--fundo); color: var(--texto); font-size: min(1.2vw, 2.05vh); line-height: 1.25; cursor: none; }
  #monitor[hidden] { display: none; }
  #monitor.ativo { cursor: default; }
  .mTopo { display: flex; align-items: center; gap: 1.2em; padding-bottom: .7em; border-bottom: .22em solid #ffd500; }
  .mTitulo { font-size: 1.7em; font-weight: 800; letter-spacing: .02em; }
  .mTopo .status { font-size: 1em; padding: .35em .9em; }
  .mTopo .status:not(.andando):not(.fim) { background: #222936; }
  .mTopo .status i { width: .75em; height: .75em; }
  .mRelogio { font-size: 2em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mCorpo { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1.1em; min-height: 0; }
  .mPainel { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: .9em 1.1em; border-radius: 1em; background: var(--cartao); }
  .mTit { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-bottom: .55em; font-size: 1.25em; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #ffd500; }
  .mPontos { display: flex; gap: .4em; }
  .mPontos i { width: .55em; height: .55em; border-radius: 50%; background: var(--trilho); }
  .mPontos i.on { background: #ffd500; }
  .mProg { display: flex; align-items: center; gap: .9em; margin-bottom: .7em; }
  .mProg strong { font-size: 2.2em; line-height: 1; font-variant-numeric: tabular-nums; }
  .mProg span { color: var(--suave); font-size: .85em; line-height: 1.15; }
  .mProg .progresso { flex: 1; height: 1em; margin: 0; }
  .mLista { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-auto-rows: minmax(0, 1fr); gap: .45em; }
  .mCand { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1em; align-items: center; min-height: 0; padding: .25em .9em; border-radius: .7em;
    background: color-mix(in srgb, var(--cor) 14%, transparent); box-shadow: inset .35em 0 0 var(--cor); }
  .mCand.bandeira { box-shadow: none; background: linear-gradient(180deg, var(--faixas)) left / .35em 100% no-repeat, color-mix(in srgb, var(--cor) 14%, transparent); }
  .mCand .foto { width: 3em; height: 3.6em; border-width: .16em; border-radius: .4em; }
  .mCand.bandeira .foto { padding: .16em; }
  .mNome { font-size: 1.45em; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mPart { margin-left: .6em; color: var(--suave); font-size: .65em; font-weight: 600; }
  .mNome .selo { font-size: .5em; vertical-align: middle; }
  .mCand .barra { height: .8em; margin-top: .35em; }
  .mNum { text-align: right; font-variant-numeric: tabular-nums; }
  .mNum strong { display: block; font-size: 2.1em; line-height: 1.05; color: color-mix(in srgb, var(--cor) 60%, #fff); }
  .mNum span { color: var(--suave); font-size: .85em; }
  .mUFs { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); }
  .mUF { display: grid; grid-template-columns: 9.5em 4.6em minmax(0, 1fr) minmax(0, 1fr); gap: .8em; align-items: center; border-top: 1px solid var(--linha); font-size: 1.05em; font-variant-numeric: tabular-nums; }
  .mUF > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mUF.mCab { border-top: 0; color: var(--suave); font-size: .85em; }
  .mUF .ponto { width: .7em; height: .7em; margin-right: .4em; }
  .mNumeros { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .7em; }
  .mNumeros div { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: .5em 1em; border-radius: .7em; border-left: .35em solid var(--cor); background: color-mix(in srgb, var(--cor) 14%, transparent); }
  .mNumeros span { color: var(--suave); }
  .mNumeros strong { font-size: 2em; line-height: 1.1; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--cor) 60%, #fff); }
  .mNumeros small { color: var(--suave); font-size: .85em; font-variant-numeric: tabular-nums; }
  .mRodape { display: flex; justify-content: space-between; gap: 1em; color: var(--suave); font-size: .9em; }
  .mControles { position: absolute; left: 50%; bottom: .9em; transform: translateX(-50%); display: flex; gap: .6em; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #monitor.ativo .mControles { opacity: 1; pointer-events: auto; }
  .mControles button { font-size: max(14px, 1em); color: #1a1a00; background: #ffd500; border-color: #ffd500; box-shadow: 0 .3em 1.2em rgba(0, 0, 0, .6); }
  @media (orientation: portrait) {
    #monitor { font-size: min(2.6vw, 1.4vh); padding: 1em; }
    .mCorpo { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1.3fr 1fr; }
    .mTitulo { font-size: 1.25em; }
  }

  /* Aviso de eleito: aparece por cima de tudo (inclusive do modo monitor) e some sozinho. */
  #aviso { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .72);
    --cartao: #141821; --texto: #f3f5f9; --suave: #a7b1c0; --trilho: #252b36; color: var(--texto);
    font-size: clamp(13px, min(1.5vw, 2.6vh), 38px); }
  #aviso[hidden] { display: none; }
  .aCartao { position: relative; width: min(32em, 100%); padding: 1.4em 1.6em 1.6em; border-radius: 1.2em; text-align: center; overflow: hidden;
    background: linear-gradient(180deg, color-mix(in srgb, var(--cor) 34%, var(--cartao)), var(--cartao) 62%);
    border-top: .5em solid var(--cor); box-shadow: 0 1.5em 5em rgba(0, 0, 0, .7); animation: aEntra .45s cubic-bezier(.2, 1.3, .4, 1); }
  .aCartao.bandeira { border-image: linear-gradient(90deg, var(--faixas)) 1; }
  @keyframes aEntra { from { transform: scale(.82); opacity: 0; } }
  .aSelo { display: inline-block; padding: .25em 1em; border-radius: 99px; background: #ffd500; color: #1a1a00; font-weight: 800; letter-spacing: .08em; }
  .aLocal { margin-top: .7em; font-size: 1.5em; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
  .aCartao .foto { display: block; width: 7.2em; height: 8.8em; margin: .8em auto .6em; border-width: .28em; border-radius: .8em; }
  .aCartao.bandeira .foto { padding: .28em; }
  .aNome { font-size: 2.3em; font-weight: 800; line-height: 1.1; text-wrap: balance; }
  .aPartido { margin-top: .3em; color: var(--suave); }
  .aCargo { margin-top: .9em; font-weight: 700; }
  .aNums { margin-top: .2em; color: var(--suave); font-variant-numeric: tabular-nums; }
  .aNums strong { font-size: 1.7em; color: color-mix(in srgb, var(--cor) 55%, #fff); }
  .aFila { margin-top: .8em; color: var(--suave); font-size: .85em; }
  .aTempo { position: absolute; left: 0; right: 0; bottom: 0; height: .4em; background: var(--trilho); }
  .aTempo i { display: block; height: 100%; background: #ffd500; animation: aTempo linear forwards; }
  @keyframes aTempo { from { width: 100%; } to { width: 0; } }
  .aFechar { position: absolute; top: .7em; right: .7em; width: 2.2em; height: 2.2em; padding: 0; border-radius: 50%; font-size: max(14px, .8em); color: var(--texto); background: rgba(0, 0, 0, .35); border-color: transparent; }
  @media (prefers-reduced-motion: reduce) { .aCartao { animation: none; } }

  /* Tela de resultado: mais votado e menos votado de cada cargo. */
  #resultado { width: min(780px, calc(100% - 24px)); }
  .rTopo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #fff; background: linear-gradient(90deg, #0a3fa8, #00913a); border-bottom: 4px solid #ffd500; }
  .rTopo h3 { flex: 1; margin: 0; font-size: 18px; }
  .rTopo .fFechar { color: #1a1a00; background: #ffd500; border-color: #ffd500; }
  .rAbas { display: flex; gap: 8px; padding: 12px 16px 0; }
  .rAbas button.on { color: #fff; background: #1d4ed8; border-color: #1d4ed8; }
  .rUF { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .rCartao { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
  .rCab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 6px; }
  .rCab h4 { flex: 1; font-size: 15px; }
  .rSit { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--alerta); color: var(--alerta); white-space: nowrap; }
  .rSit.final { border-color: var(--ok); color: var(--ok); }
  .rLinha { display: grid; grid-template-columns: 104px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--linha); }
  .rLinha .foto { width: 40px; height: 48px; border-width: 2px; }
  .rRot { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 6px; text-align: center; color: #fff; }
  .rRot.mais { background: #15803d; }
  .rRot.menos { background: #b91c1c; }
  .rLinha .nome { font-weight: 700; }
  .rCartao .nota { margin: 6px 0 0; }
  @media (max-width: 600px) {
    .rLinha { grid-template-columns: 40px minmax(0, 1fr) auto; }
    .rRot { grid-column: 1 / -1; justify-self: start; }
  }

  /* Logotipos redondos nas laterais da página; em telas estreitas viram uma fileira abaixo do topo. */
  /* --margem é a faixa livre de cada lado do conteúdo; o logotipo cresce com ela, até 250px. */
  .logos { --margem: max(150px, calc((100vw - 1236px) / 2)); }
  .lateral { position: fixed; top: 50%; z-index: 4; transform: translateY(-42%); width: var(--margem); display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .lateral.esq { left: 0; }
  .lateral.dir { right: 0; }
  .lateral img, .mLogos img { border-radius: 50%; object-fit: cover; background: #fff; }
  .lateral img { display: block; width: min(clamp(110px, calc(var(--margem) - 44px), 250px), 36vh); height: auto; aspect-ratio: 1; border: 4px solid #fff; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
  @media (min-width: 1001px) { main { padding-inline: 150px; max-width: 1536px; } }
  @media (max-width: 1000px) {
    .logos { display: flex; justify-content: center; gap: 14px; padding: 12px 10px 0; }
    .lateral { position: static; transform: none; width: auto; flex-direction: row; gap: 14px; }
    .lateral img { width: 70px; border-width: 2px; }
  }
  .mLogos { display: flex; gap: .5em; }
  .mLogos img { width: 2.3em; height: 2.3em; border: .1em solid #fff; }

  /* Mapa do Brasil: cada estado pintado com a cor de quem lidera para presidente. */
  .mapaGrade { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .mapaGrade { grid-template-columns: minmax(0, 1fr); } }
  .mapaSVG { display: block; width: 100%; height: auto; max-height: 660px; }
  .mapaSVG path { fill: var(--trilho); stroke: var(--cartao); stroke-width: 1.5; stroke-linejoin: round; cursor: pointer; transition: fill .4s, fill-opacity .4s; }
  .mapaSVG path:hover { filter: brightness(1.25); }
  .mapaSVG path.feito { stroke: var(--texto); stroke-width: 3.5; }
  .mapaSVG path.sel { stroke: #ffd500; stroke-width: 6; }
  .mapaSVG text { font: 700 21px "Segoe UI", system-ui, sans-serif; fill: #fff; stroke: rgba(0, 0, 0, .8); stroke-width: 4.5; paint-order: stroke; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .mapaSVG line { stroke: var(--suave); stroke-width: 1.5; pointer-events: none; }
  #mapaDetalhe { display: grid; gap: 10px; }
  #mapaDetalhe h4 { margin: 4px 0 0; font-size: 14px; color: var(--suave); }
  .mdLinha { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; }
  .mdLinha .ponto { margin: 0; }
  .mdNome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mdNum { text-align: right; font-variant-numeric: tabular-nums; }
  .mdNum b { font-size: 17px; color: color-mix(in srgb, var(--cor) 65%, var(--texto)); }
  .mdLinha .barra { grid-column: 1 / -1; height: 9px; margin: 0; }
  .mapaLegenda { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; color: var(--suave); font-size: 13px; }
  .mapaLegenda b { color: var(--texto); }
  .mMapa { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .mMapa .mapaSVG { width: auto; height: 100%; max-height: none; }
  .mMapa .mapaSVG path { stroke: var(--cartao); cursor: inherit; }
  .mMapa .mapaSVG path.feito { stroke: #fff; }
  .mPainel .mapaLegenda { margin-top: .5em; font-size: .9em; justify-content: center; }
</style>
</head>
<body>

<div id="monitor" hidden>
  <div class="mTopo">

    <span class="espaco"></span>

<div id="aviso" role="alertdialog" aria-live="assertive" hidden></div>

<dialog id="ficha" aria-label="Dados do candidato"><div id="fichaCorpo"></div></dialog>

<script>
// Trocar a cada publicação: é o que faz as páginas já abertas recarregarem sozinhas, sem F5.
const VERSAO = '2026-10-04 19:50';
const CICLO = 'ele2026';
// No computador (localhost) as consultas passam pelo server.js; publicada na internet, a página fala direto com o TSE.
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const TSE = LOCAL ? '/tse/' : 'https://resultados.tse.jus.br/';
// Códigos das eleições no TSE: federal (presidente) e estadual (governador, senador, deputados).
const TURNOS = { 1: { fed: '6257', est: '6259' }, 2: { fed: '6258', est: '6260' } };
const UFS = { ac: 'Acre', al: 'Alagoas', ap: 'Amapá', am: 'Amazonas', ba: 'Bahia', ce: 'Ceará', df: 'Distrito Federal',
  es: 'Espírito Santo', go: 'Goiás', ma: 'Maranhão', mt: 'Mato Grosso', ms: 'Mato Grosso do Sul', mg: 'Minas Gerais',
  pa: 'Pará', pb: 'Paraíba', pr: 'Paraná', pe: 'Pernambuco', pi: 'Piauí', rj: 'Rio de Janeiro', rn: 'Rio Grande do Norte',
  rs: 'Rio Grande do Sul', ro: 'Rondônia', rr: 'Roraima', sc: 'Santa Catarina', sp: 'São Paulo', se: 'Sergipe',
  to: 'Tocantins', zz: 'Exterior' };
// Cada candidato recebe uma cor fixa (pela ordem de registro no TSE), a mesma em todas as telas.
const PALETA = ['#2563eb', '#f97316', '#16a34a', '#e11d48', '#9333ea', '#db2777', '#0891b2', '#eab308', '#4f46e5', '#65a30d', '#0d9488', '#c026d3'];
// Na disputa presidencial, o candidato do PT (13) fica de vermelho e o do PL (22) com as cores da bandeira.
// Quem cairia no vermelho ou no verde da paleta recebe as cores que os dois deixaram livres.
const naBandeira = (c) => c.cargo === '1' && c.n === '22';
function corDe(c) {
  const base = PALETA[(Math.max(num(c.seq), 1) - 1) % PALETA.length];
  if (c.cargo !== '1') return base;
  if (c.n === '13') return '#e81414';
  if (c.n === '22') return '#009c3b';
  if (base === '#e11d48') return '#2563eb';
  if (base === '#16a34a') return '#4f46e5';
  return base;
}
const CARGOS = { 3: 'Governador', 5: 'Senador', 6: 'Deputado Federal', 7: 'Deputado Estadual' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (s) => Number(String(s ?? 0).replace(/\./g, '').replace(',', '.')) || 0;
const milhar = (s) => num(s).toLocaleString('pt-BR');
const zeros = (s, n) => String(s).padStart(n, '0');

function ler(chave, padrao) {
  try { return localStorage.getItem('apuracao.' + chave) ?? padrao; } catch { return padrao; }
}
function gravar(chave, valor) {
  try { localStorage.setItem('apuracao.' + chave, valor); } catch {}
}

const S = {
  turno: ler('turno', '1'),
  presAbr: ler('presAbr', 'br'),
  presMun: ler('presMun', ''),
  estUF: ler('estUF', 'sp'),
  mapaUF: ler('mapaUF', ''),
  estCargo: ler('estCargo', '3'),
  intervalo: Number(ler('intervalo', '30')),
};
let falta = 0;
let municipios = null;
let dadosEstado = null;

function urlDados(ele, abr, cargo, mun) {
  return `${TSE}oficial/${CICLO}/${ele}/dados/${abr}/${abr}${mun || ''}-c${zeros(cargo, 4)}-e${zeros(ele, 6)}-u.json`;
}

async function getJSON(url) {
  const r = await fetch(url, LOCAL ? { cache: 'no-store' } : {});
  if (!r.ok) throw Object.assign(new Error('Erro ' + r.status), { status: r.status });
  return r.json();
}

function candidatos(d) {
  const lista = [];
  const feds = Object.fromEntries((d.carg?.[0]?.fed ?? []).map((f) => [f.n, f]));
  for (const agr of d.carg?.[0]?.agr ?? []) {
    for (const par of agr.par ?? []) {
      for (const c of par.cand ?? []) lista.push({ ...c, sg: par.sg, partido: par.nm, agr: agr.nm, agrTipo: agr.tp, agrPartidos: agr.com, federacao: feds[par.nfed],
        vice: c.vs?.[0]?.nmu, cargo: String(d.carg[0].cd), cargoNome: d.carg[0].nmn });
    }
  }
  return lista.sort((a, b) => num(b.vap) - num(a.vap) || num(a.seq) - num(b.seq));
}

function mensagemErro(e) {
  return e.status === 404
    ? '<p class="aviso">O TSE ainda não publicou dados para esta consulta.</p>'
    : '<p class="aviso falha">Não foi possível falar com o TSE agora. Nova tentativa na próxima atualização.</p>';
}

function resumo(d) {
  const { s = {}, e = {}, v = {} } = d;
  const item = (rotulo, pct, qtd, cor) => `<div style="--cor:${cor}"><span>${rotulo}</span><strong>${esc(pct)}%</strong><small>${milhar(qtd)}</small></div>`;
  return `<div class="progresso" title="Seções totalizadas"><i style="width:${num(s.pst)}%"></i></div>
    <div class="resumo">
      ${item('Seções totalizadas', s.pst, s.st, '#16a34a')}
      ${item('Comparecimento', e.pc, e.c, '#2563eb')}
      ${item('Abstenção', e.pa, e.a, '#f97316')}
      ${item('Votos válidos', v.pvv, v.vv, '#0891b2')}
      ${item('Brancos', v.pvb, v.vb, '#9333ea')}
      ${item('Nulos', v.ptvn, v.tvn, '#e11d48')}
    </div>`;
}

// Guarda os candidatos e as opções de cada lista ('pres' e 'est') para abrir a ficha ao clicar no nome.
const REG = {};
const INFO = {};
const dadosUFs = {};
let ficha = null; // { origem, sq }

// opcoes: { origem, ele, fotoAbr, majoritario (barra em % absoluto com marca de 50%), semVice, filtro, limite }
function listaHTML(d, opcoes) {
  const cargo = d.carg?.[0] ?? {};
  let lista = candidatos(d);
  const total = lista.length;
  const vagas = num(cargo.nv) || 1;
  const destaque = opcoes.majoritario ? 2 : vagas <= 2 ? vagas : 0;
  const temVoto = lista.some((c) => num(c.vap) > 0);
  const maior = Math.max(...lista.map((c) => num(c.pvap)), 0.0001);
  lista.forEach((c, i) => { c.pos = i + 1; });
  REG[opcoes.origem] = new Map(lista.map((c) => [c.sqcand, c]));
  INFO[opcoes.origem] = opcoes;
  if (opcoes.filtro) {
    const f = opcoes.filtro.toLowerCase();
    lista = lista.filter((c) => `${c.nmu} ${c.nm} ${c.sg} ${c.n}`.toLowerCase().includes(f));
  }
  const cortada = opcoes.limite && lista.length > opcoes.limite;
  if (cortada) lista = lista.slice(0, opcoes.limite);

  const itens = lista.map((c) => {
    const largura = opcoes.majoritario ? num(c.pvap) : (num(c.pvap) / maior) * 100;
    const classe = (temVoto && c.pos <= destaque ? ' frente' : '') + (naBandeira(c) ? ' bandeira' : '');
    const selo = c.st ? `<span class="selo">${esc(c.st)}</span>` : '';
    return `<li class="cand${classe}" data-sq="${esc(c.sqcand)}" style="--cor:${corDe(c)}">
      <img class="foto" loading="lazy" alt="" src="${TSE}oficial/${CICLO}/${opcoes.ele}/fotos/${opcoes.fotoAbr}/${esc(c.sqcand)}.jpeg" onerror="this.style.visibility='hidden'">
      <div>
        <div><button type="button" class="nome" title="Ver dados do candidato">${esc(c.nmu)}</button>${selo}</div>
        <div class="partido">${esc(c.n)} · ${esc(c.sg)}${c.vice && !opcoes.semVice ? ' · vice ' + esc(c.vice) : ''}</div>
        <div class="barra"><i style="width:${Math.min(largura, 100)}%"></i>${opcoes.majoritario ? '<b></b>' : ''}</div>
      </div>
      <div class="nums"><strong>${esc(c.pvap)}%</strong><span>${milhar(c.vap)} votos</span></div>
    </li>`;
  }).join('');

  const notas = [];
  if (!temVoto) notas.push('Nenhum voto totalizado ainda. Os candidatos aparecem na ordem do TSE até a apuração começar.');
  if (opcoes.majoritario) notas.push('Percentuais sobre os votos válidos. A marca no meio da barra indica 50%.');
  if (cortada) notas.push(`Mostrando os ${opcoes.limite} mais votados de ${total}. Use a busca para achar outros.`);
  if (!lista.length) notas.push('Nenhum candidato encontrado.');
  return resumo(d) + `<ol class="cands">${itens}</ol>` + notas.map((n) => `<p class="nota">${n}</p>`).join('');
}

function atualizarStatus(d) {
  const pst = num(d.s?.pst);
  const el = $('status');
  let texto = 'Aguardando o início da apuração';
  el.className = 'status';
  if (d.tf === 's' || pst >= 100) { texto = 'Apuração concluída'; el.className = 'status fim'; }
  else if (pst > 0) { texto = `Em andamento · ${d.s.pst}% das seções`; el.className = 'status andando'; }
  el.lastElementChild.textContent = texto;
  $('tse').textContent = d.dt ? `Última totalização do TSE: ${d.dt} ${d.ht}` : `Arquivo do TSE gerado em ${d.dg} ${d.hg}`;
  $('mStatus').className = el.className;
  $('mStatus').lastElementChild.textContent = texto;
  $('mTse').textContent = $('tse').textContent;
  // Quando a apuração termina, a tela de resultado abre sozinha uma única vez (fora do modo monitor).
  const concluida = d.tf === 's' || pst >= 100;
  if (concluida && ler('resultadoVisto', '') !== S.turno && !monitorAberto() && !$('resultado').open) {
    gravar('resultadoVisto', S.turno);
    abrirResultado();
  }
  document.title = pst > 0 ? `${d.s.pst}% apurado · Eleições 2026` : 'Apuração 2026';
}

async function carregarPresidente() {
  const ele = TURNOS[S.turno].fed;
  const noBrasil = S.presAbr === 'br';
  try {
    const brasil = getJSON(urlDados(ele, 'br', 1));
    const d = noBrasil ? await brasil : await getJSON(urlDados(ele, S.presAbr, 1, S.presMun));
    $('pres').innerHTML = listaHTML(d, { origem: 'pres', ele, fotoAbr: 'br', majoritario: true, semVice: true });
    dadosBR = await brasil;
    atualizarStatus(dadosBR);
  } catch (e) {
    if (e.status === 404) dadosBR = null;
    $('pres').innerHTML = mensagemErro(e);
    if (e.status === 404) $('status').lastElementChild.textContent = 'Sem dados para este turno';
  }
}

function mostrarEstado() {
  if (!dadosEstado) return;
  const deputados = Number(S.estCargo) >= 6;
  $('est').innerHTML = listaHTML(dadosEstado, {
    origem: 'est',
    ele: TURNOS[S.turno].est,
    fotoAbr: S.estUF,
    majoritario: S.estCargo === '3',
    filtro: deputados ? $('busca').value.trim() : '',
    limite: deputados ? 40 : 0,
  });
}

async function carregarEstado() {
  // No Distrito Federal o cargo é Deputado Distrital (código 8).
  const cargo = S.estCargo === '7' && S.estUF === 'df' ? 8 : S.estCargo;
  try {
    dadosEstado = await getJSON(urlDados(TURNOS[S.turno].est, S.estUF, cargo));
    mostrarEstado();
  } catch (e) {
    dadosEstado = null;
    $('est').innerHTML = mensagemErro(e);
  }
}

async function carregarUFs() {
  const ele = TURNOS[S.turno].fed;
  const siglas = Object.keys(UFS);
  const respostas = await Promise.allSettled(siglas.map((uf) => getJSON(urlDados(ele, uf, 1))));
  if (respostas.every((r) => r.status === 'rejected')) {
    $('ufs').innerHTML = mensagemErro(respostas[0].reason);
    return;
  }
  siglas.forEach((uf, i) => { dadosUFs[uf] = respostas[i].status === 'fulfilled' ? respostas[i].value : null; });
  const linhas = siglas.map((uf, i) => {
    if (respostas[i].status === 'rejected') return `<tr data-uf="${uf}"><td>${UFS[uf]}</td><td colspan="4" class="meta">sem dados</td></tr>`;
    const d = respostas[i].value;
    const [a, b] = candidatos(d);
    const temVoto = a && num(a.vap) > 0;
    const celula = (c, classe) => (temVoto && c ? `<i class="ponto${naBandeira(c) ? ' bandeira' : ''}" style="--cor:${corDe(c)}"></i><span class="${classe}">${esc(c.nmu)}</span> ${esc(c.pvap)}%` : '—');
    return `<tr data-uf="${uf}">
      <td><strong>${UFS[uf]}</strong></td>
      <td><span class="mini"><i style="width:${num(d.s?.pst)}%"></i></span>${esc(d.s?.pst)}%</td>
      <td>${celula(a, 'c1')}</td>
      <td>${celula(b, 'c2')}</td>
      <td>${temVoto ? milhar(d.v?.vv) : '—'}</td>
    </tr>`;
  }).join('');
  renderMapa();
  $('ufs').innerHTML = `<table>
    <thead><tr><th>Estado</th><th>Seções totalizadas</th><th>1º colocado</th><th>2º colocado</th><th>Votos válidos</th></tr></thead>
    <tbody>${linhas}</tbody></table>`;
}

// ---- Mapa do Brasil: contorno dos estados (IBGE) pintado com a cor de quem lidera para presidente em cada um.
let MAPA = null;
let mapaSoFeitos = false;
// Estados pequenos demais para o rótulo caber dentro: a sigla vai para o lado, ligada por um traço.
const ROTULO_FORA = { rn: [52, -12], pb: [66, 0], pe: [92, 8], al: [50, 12], se: [40, 20], es: [42, 0], rj: [34, 30], df: [30, -16] };

function estadoMapa(uf) {
  const d = dadosUFs[uf];
  const lista = d ? candidatos(d) : [];
  const pst = num(d?.s?.pst);
  return { d, lista, pst, lider: lista[0] && num(lista[0].vap) > 0 ? lista[0] : null, feito: !!d && (d.tf === 's' || pst >= 100) };
}

function mapaSVG(selecionado, soFeitos) {
  if (!MAPA) return '';
  const formas = [];
  let rotulos = '';
  for (const [uf, f] of Object.entries(MAPA.ufs)) {
    const e = estadoMapa(uf);
    const pinta = e.lider && (!soFeitos || e.feito);
    // Quanto mais seções apuradas, mais forte a cor.
    const estilo = pinta ? `fill:${corDe(e.lider)};fill-opacity:${(0.35 + 0.65 * e.pst / 100).toFixed(2)}` : '';
    const dica = `${UFS[uf]}: ${e.lider ? `${e.lider.nmu} ${e.lider.pvap}%` : 'sem votos'} · ${e.d?.s?.pst ?? '0,00'}% das seções`;
    formas.push({ ordem: uf === selecionado ? 2 : e.feito ? 1 : 0,
      svg: `<path data-uf="${uf}" class="${e.feito ? 'feito' : ''}${uf === selecionado ? ' sel' : ''}" style="${estilo}" d="${f.d}"><title>${esc(dica)}</title></path>` });
    const [dx, dy] = ROTULO_FORA[uf] ?? [0, 0];
    if (dx || dy) rotulos += `<line x1="${f.cx}" y1="${f.cy}" x2="${f.cx + dx - Math.sign(dx) * 20}" y2="${f.cy + dy}"/>`;
    rotulos += `<text x="${f.cx + dx}" y="${f.cy + dy}">${uf.toUpperCase()}</text>`;
  }
  // O estado em destaque e os concluídos são desenhados por último, para o contorno ficar por cima dos vizinhos.
  formas.sort((a, b) => a.ordem - b.ordem);
  return `<svg class="mapaSVG" viewBox="-12 -12 ${MAPA.largura + 110} ${MAPA.altura + 24}" role="img" aria-label="Mapa do Brasil com quem lidera para presidente em cada estado">${formas.map((f) => f.svg).join('')}${rotulos}</svg>`;
}

function mapaLegendaHTML(completa) {
  const lideres = new Map();

  }

    `<span><i class="ponto${naBandeira(c) ? ' bandeira' : ''}" style="--cor:${corDe(c)}"></i><b>${esc(c.nmu)}</b> lidera em ${n} ${n === 1 ? 'estado' : 'estados'}</span>`);

function idade(nascimento) {
  const [dia, mes, ano] = String(nascimento || '').split('/').map(Number);
  if (!ano) return '';
  const hoje = new Date();
  const fezAniversario = hoje.getMonth() + 1 > mes || (hoje.getMonth() + 1 === mes && hoje.getDate() >= dia);
  return hoje.getFullYear() - ano - (fezAniversario ? 0 : 1);
}

// Pede ao navegador para não apagar a tela enquanto o monitor estiver aberto (nem todo navegador atende).
async function manterTelaLigada() {
  try { mTravaTela = await navigator.wakeLock?.request('screen'); } catch {}
}

async function telaCheia() {
  try { await document.documentElement.requestFullscreen(); } catch {}
}

async function abrirMonitor(cheia) {
  $('monitor').hidden = false;
  document.body.style.overflow = 'hidden';
  if (location.hash !== '#monitor') history.replaceState(null, '', '#monitor');
  mRodizio ??= setInterval(() => { mQuadro += 1; renderMonitorDireita(); }, TROCA_QUADRO);
  if (cheia) telaCheia();
  manterTelaLigada();
  renderMonitor();
  await carregarMonitor();
  renderMonitorDireita();
}

function fecharMonitor() {
  $('monitor').hidden = true;
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname + location.search);
  clearInterval(mRodizio);
  mRodizio = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  mTravaTela?.release().catch(() => {});
  mTravaTela = null;
}

// ---- Resultado: mais votado e menos votado de cada cargo, no geral (Brasil inteiro) e por estado.
const ESTADOS = Object.keys(UFS).filter((uf) => uf !== 'zz');
// Senadores e deputados dos 27 estados são dezenas de arquivos grandes: o geral recarrega no máximo a cada 2 minutos.
const VALIDADE_GERAL = 120000;
let resAba = 'geral';
let dadosRes = { uf: null, lista: [] };
const dadosGeral = { quando: 0, turno: null, cargos: null, carregando: null };

// Guarda só o essencial de cada arquivo (primeiro, último e empates), para não ocupar memória no celular.
function resumir(d, uf) {
  const lista = d ? candidatos(d) : [];
  if (!lista.length) return null;
  const ultimo = lista.at(-1);
  return {
    uf, total: lista.length, mais: lista.slice(0, 2), menos: ultimo,
    noMenor: lista.filter((c) => num(c.vap) === num(ultimo.vap)).length,
    temVoto: num(lista[0].vap) > 0, pst: d.s?.pst, vagas: num(d.carg[0].nv) || 1,
    final: d.tf === 's' || num(d.s?.pst) >= 100,
  };
}

async function carregarResultado() {
  const uf = S.estUF;
  const cargos = [3, 5, 6, uf === 'df' ? 8 : 7];
  const respostas = await Promise.allSettled(cargos.map((cargo) => getJSON(urlDados(TURNOS[S.turno].est, uf, cargo))));
  dadosRes = { uf, lista: respostas.map((r) => (r.status === 'fulfilled' ? resumir(r.value, uf) : null)) };
}

function carregarGeral() {
  if (dadosGeral.carregando) return dadosGeral.carregando;
  if (dadosGeral.turno === S.turno && Date.now() - dadosGeral.quando < VALIDADE_GERAL) return Promise.resolve();
  const turno = S.turno;
  const ele = TURNOS[turno].est;
  const tarefas = [];
  for (const cargo of [5, 6, 7]) for (const uf of ESTADOS) tarefas.push({ cargo, uf });
  const cargos = { 5: [], 6: [], 7: [] };
  // Nove consultas por vez, para não sobrecarregar o TSE nem o navegador.
  const trabalhar = async () => {
    for (let t = tarefas.shift(); t; t = tarefas.shift()) {
      try {
        const d = await getJSON(urlDados(ele, t.uf, t.cargo === 7 && t.uf === 'df' ? 8 : t.cargo));
        cargos[t.cargo].push(resumir(d, t.uf));
      } catch {}
    }
  };
  dadosGeral.carregando = Promise.all(Array.from({ length: 9 }, trabalhar)).then(() => {
    Object.assign(dadosGeral, { quando: Date.now(), turno, cargos, carregando: null });
  });
  return dadosGeral.carregando;
}

// local: nome do estado, usado no geral para dizer de onde é o candidato.
function resLinha(c, rotulo, classe, ele, fotoAbr, local) {
  return `<div class="rLinha${naBandeira(c) ? ' bandeira' : ''}" style="--cor:${corDe(c)}">
      <span class="rRot ${classe}">${rotulo}</span>
      <img class="foto" alt="" loading="lazy" src="${TSE}oficial/${CICLO}/${ele}/fotos/${fotoAbr}/${esc(c.sqcand)}.jpeg" onerror="this.style.visibility='hidden'">
      <div style="min-width:0"><div class="nome">${esc(c.nmu)}${c.st ? `<span class="selo">${esc(c.st)}</span>` : ''}</div>
        <div class="partido">${esc(c.n)} · ${esc(c.sg)}${local ? ' · ' + esc(local) : ''}</div></div>
      <div class="nums">${local
        ? `<strong>${milhar(c.vap)}</strong><span>votos · ${esc(c.pvap)}% no estado</span>`
        : `<strong>${esc(c.pvap)}%</strong><span>${milhar(c.vap)} votos</span>`}</div>
    </div>`;
}

function resMoldura(titulo, situacao, final, corpo, rodape) {
  return `<div class="rCartao"><div class="rCab"><h4>${titulo}</h4>${situacao ? `<span class="rSit${final ? ' final' : ''}">${situacao}</span>` : ''}</div>${corpo}${rodape ? `<p class="nota">${rodape}</p>` : ''}</div>`;
}

const NOTA_DEPUTADO = '<p class="nota">Para deputado, ser o mais votado não garante a vaga: a eleição depende também dos votos do partido.</p>';
const notaEmpate = (n, votos) => (n > 0 ? `<p class="nota">Outros ${n} ${n === 1 ? 'candidato teve' : 'candidatos tiveram'} a mesma votação do menos votado (${milhar(votos)} votos).</p>` : '');

// Um cargo em um lugar só (presidente no Brasil ou em um estado, e os cargos de um estado).
function resCartao(r, titulo, ele, fotoAbr, cargo) {
  if (!r) return resMoldura(titulo, '', false, '<p class="nota">O TSE ainda não publicou dados para este cargo.</p>');
  const situacao = r.final ? 'Resultado final' : num(r.pst) > 0 ? `Parcial · ${esc(r.pst)}% das seções` : 'Apuração não iniciada';
  if (!r.temVoto) return resMoldura(titulo, situacao, r.final, '<p class="nota">Nenhum voto totalizado ainda.</p>', `${r.total} candidatos na disputa.`);
  // No Senado há mais de uma vaga por estado, então aparecem os mais votados até o número de vagas.
  const mais = r.mais.slice(0, cargo === 5 ? r.vagas : 1);
  const corpo = mais.map((c) => resLinha(c, 'Mais votado', 'mais', ele, fotoAbr)).join('') + resLinha(r.menos, 'Menos votado', 'menos', ele, fotoAbr)
    + notaEmpate(r.noMenor - 1, r.menos.vap) + (cargo >= 6 ? NOTA_DEPUTADO : '');
  return resMoldura(titulo, situacao, r.final, corpo, `${r.total} candidatos na disputa.`);
}

// Um cargo no Brasil inteiro, juntando os resumos dos estados.
function resCartaoGeral(resumos, titulo, ele, cargo) {
  const lista = (resumos ?? []).filter(Boolean);
  if (!lista.length) return resMoldura(titulo, '', false, '<p class="nota">O TSE ainda não publicou dados para este cargo.</p>');
  const concluidos = lista.filter((r) => r.final).length;
  const final = concluidos === lista.length;
  const situacao = final ? 'Resultado final' : `Parcial · ${concluidos} de ${lista.length} estados concluídos`;
  const total = lista.reduce((soma, r) => soma + r.total, 0);
  const comVoto = lista.filter((r) => r.temVoto);
  if (!comVoto.length) return resMoldura(titulo, situacao, final, '<p class="nota">Nenhum voto totalizado ainda.</p>', `${total} candidatos no país.`);
  const maior = comVoto.reduce((a, b) => (num(b.mais[0].vap) > num(a.mais[0].vap) ? b : a));
  const menor = comVoto.reduce((a, b) => (num(b.menos.vap) < num(a.menos.vap) ? b : a));
  const empatados = comVoto.filter((r) => num(r.menos.vap) === num(menor.menos.vap)).reduce((soma, r) => soma + r.noMenor, 0) - 1;
  const corpo = resLinha(maior.mais[0], 'Mais votado', 'mais', ele, maior.uf, UFS[maior.uf]) + resLinha(menor.menos, 'Menos votado', 'menos', ele, menor.uf, UFS[menor.uf])
    + notaEmpate(empatados, menor.menos.vap) + (cargo >= 6 ? NOTA_DEPUTADO : '');
  const rodape = `${total} candidatos no país.` + (comVoto.length < lista.length ? ` Considera os ${comVoto.length} estados que já têm votos totalizados.` : '');
  return resMoldura(titulo, situacao, final, corpo, rodape);
}

function mostrarResultado() {
  const t = TURNOS[S.turno];
  let corpo;
  if (resAba === 'geral') {
    const pronto = dadosGeral.turno === S.turno && dadosGeral.cargos;
    corpo = resCartao(resumir(dadosBR, 'br'), 'Presidente · Brasil', t.fed, 'br', 1)
      + resCartaoGeral(ESTADOS.map((uf) => resumir(dadosGov[uf], uf)), 'Governador · todos os estados', t.est, 3)
      + (pronto
        ? resCartaoGeral(dadosGeral.cargos[5], 'Senador · todos os estados', t.est, 5)
          + resCartaoGeral(dadosGeral.cargos[6], 'Deputado Federal · todos os estados', t.est, 6)
          + resCartaoGeral(dadosGeral.cargos[7], 'Deputado Estadual e Distrital · todos os estados', t.est, 7)
        : '<p class="aviso">Carregando senadores e deputados dos 27 estados. Pode levar alguns segundos…</p>');
  } else {
    const uf = S.estUF;
    const nomes = ['Governador', 'Senador', 'Deputado Federal', uf === 'df' ? 'Deputado Distrital' : 'Deputado Estadual'];
    const opcoes = ESTADOS.map((cd) => `<option value="${cd}"${cd === uf ? ' selected' : ''}>${UFS[cd]}</option>`).join('');
    corpo = `<label class="rUF">Estado <select id="resUF">${opcoes}</select></label>`
      + resCartao(resumir(dadosUFs[uf], uf), `Presidente · ${UFS[uf]}`, t.fed, 'br', 1)
      + (dadosRes.uf === uf
        ? dadosRes.lista.map((r, i) => resCartao(r, `${nomes[i]} · ${UFS[uf]}`, t.est, uf, [3, 5, 6, 7][i])).join('')
        : '<p class="aviso">Carregando os cargos do estado…</p>');
  }
  const aba = (id, rotulo) => `<button type="button" data-aba="${id}"${resAba === id ? ' class="on"' : ''}>${rotulo}</button>`;
  const janela = $('resultado');
  const rolagem = janela.scrollTop;
  $('resultadoCorpo').innerHTML = `<div class="rTopo"><h3>Resultado · mais e menos votados</h3><button type="button" class="fFechar" data-fechar aria-label="Fechar">✕</button></div>
    <div class="rAbas">${aba('geral', 'Geral · Brasil')}${aba('estado', 'Por estado')}</div>
    <div class="fCorpo">${corpo}</div>`;
  if (!janela.open) janela.showModal();
  else janela.scrollTop = rolagem;
}

async function abrirResultado() {
  mostrarResultado();
  await (resAba === 'geral' ? carregarGeral() : carregarResultado());
  if ($('resultado').open) mostrarResultado();
}

// ---- Aviso de eleito: quando o TSE marca um governador (ou o presidente) como eleito, um aviso aparece na tela.
// Cada eleito é avisado uma única vez neste navegador, mesmo que a página seja recarregada.
const DURACAO_AVISO = 12000;
const dadosGov = {};
const filaAvisos = [];
let avisoRelogio = null;
let avisados;
try { avisados = new Set(JSON.parse(ler('avisados', '[]'))); } catch { avisados = new Set(); }

const foiEleito = (c) => c.e === 's' || /^eleit/i.test(c.st || '');

function conferirEleitos(d, local, cargo, ele, fotoAbr) {
  for (const c of candidatos(d).filter(foiEleito)) {
    const chave = ele + '-' + c.sqcand;
    if (avisados.has(chave)) continue;
    avisados.add(chave);
    filaAvisos.push({ c, local, cargo, ele, fotoAbr });
    // Já deixa a foto carregada para o aviso não abrir com o quadro vazio.
    new Image().src = `${TSE}oficial/${CICLO}/${ele}/fotos/${fotoAbr}/${c.sqcand}.jpeg`;
  }
}

function proximoAviso() {
  clearTimeout(avisoRelogio);
  const a = filaAvisos.shift();
  if (!a) { $('aviso').hidden = true; return; }
  const { c } = a;
  $('aviso').innerHTML = `<div class="aCartao${naBandeira(c) ? ' bandeira' : ''}" style="--cor:${corDe(c)}">
      <button type="button" class="aFechar" aria-label="Fechar aviso">✕</button>
      <span class="aSelo">RESULTADO DEFINIDO</span>
      <div class="aLocal">${esc(a.local)} elegeu</div>
      <img class="foto" alt="" src="${TSE}oficial/${CICLO}/${a.ele}/fotos/${a.fotoAbr}/${esc(c.sqcand)}.jpeg" onerror="this.style.visibility='hidden'">
      <div class="aNome">${esc(c.nmu)}</div>
      <div class="aPartido">${esc(c.sg)}${c.vice ? ' · vice ' + esc(c.vice) : ''}</div>
      <div class="aCargo">${a.cargo} · ${S.turno === '2' ? '2º' : '1º'} turno</div>
      <div class="aNums"><strong>${esc(c.pvap)}%</strong> dos votos válidos · ${milhar(c.vap)} votos</div>
      ${filaAvisos.length ? `<div class="aFila">Mais ${filaAvisos.length} ${filaAvisos.length === 1 ? 'aviso' : 'avisos'} em seguida</div>` : ''}
      <div class="aTempo"><i style="animation-duration:${DURACAO_AVISO}ms"></i></div>
    </div>`;
  $('aviso').hidden = false;
  avisoRelogio = setTimeout(proximoAviso, DURACAO_AVISO);
}

// Busca o governador de todos os estados só para saber quem já foi eleito.
async function carregarGovernadores() {
  const ele = TURNOS[S.turno].est;
  const siglas = Object.keys(UFS).filter((uf) => uf !== 'zz');
  const respostas = await Promise.allSettled(siglas.map((uf) => getJSON(urlDados(ele, uf, 3))));
  siglas.forEach((uf, i) => {
    dadosGov[uf] = respostas[i].status === 'fulfilled' ? respostas[i].value : null;
    if (dadosGov[uf]) conferirEleitos(dadosGov[uf], UFS[uf], 'Governo do estado', ele, uf);
  });
}

function avisarEleitos() {
  if (dadosBR) conferirEleitos(dadosBR, 'O Brasil', 'Presidência da República', TURNOS[S.turno].fed, 'br');
  gravar('avisados', JSON.stringify([...avisados]));
  if ($('aviso').hidden) proximoAviso();
}

function atualizar() {
  falta = S.intervalo;
  return Promise.all([carregarPresidente(), carregarEstado(), carregarUFs(), carregarMonitor(), carregarGovernadores()]).then(() => {
    if ($('ficha').open) mostrarFicha();
    if ($('resultado').open) abrirResultado();
    renderMapa();
    renderMonitor();
    avisarEleitos();
  });
}

function montarControles() {
  const ufs = Object.entries(UFS);
  $('presAbr').innerHTML = '<option value="br">Brasil</option>' + ufs.map(([cd, nm]) => `<option value="${cd}">${nm}</option>`).join('');
  $('estUF').innerHTML = ufs.filter(([cd]) => cd !== 'zz').map(([cd, nm]) => `<option value="${cd}">${nm}</option>`).join('');
  $('estCargo').innerHTML = Object.entries(CARGOS).map(([cd, nm]) => `<option value="${cd}">${nm}</option>`).join('');
  if (!UFS[S.estUF] || S.estUF === 'zz') S.estUF = 'sp';
  if (S.presAbr !== 'br' && !UFS[S.presAbr]) S.presAbr = 'br';
  if (!CARGOS[S.estCargo]) S.estCargo = '3';
  if (!TURNOS[S.turno]) S.turno = '1';
  $('turno').value = S.turno;
  $('presAbr').value = S.presAbr;
  $('estUF').value = S.estUF;
  $('estCargo').value = S.estCargo;
  $('intervalo').value = String(S.intervalo);
  if (!$('intervalo').value) { S.intervalo = 30; $('intervalo').value = '30'; }
  $('busca').hidden = Number(S.estCargo) < 6;

  const aoMudar = (id, chave, depois) => $(id).addEventListener('change', (ev) => {
    S[chave] = ev.target.value;
    gravar(chave, S[chave]);
    depois();
  });
  aoMudar('turno', 'turno', atualizar);
  aoMudar('presAbr', 'presAbr', async () => { S.presMun = ''; gravar('presMun', ''); await preencherMunicipios(); carregarPresidente(); });
  aoMudar('presMun', 'presMun', carregarPresidente);
  aoMudar('estUF', 'estUF', carregarEstado);
  aoMudar('estCargo', 'estCargo', () => { $('busca').hidden = Number(S.estCargo) < 6; $('busca').value = ''; carregarEstado(); });
  aoMudar('intervalo', 'intervalo', () => { S.intervalo = Number(S.intervalo); falta = S.intervalo; });
  $('busca').addEventListener('input', mostrarEstado);
  $('agora').addEventListener('click', atualizar);
  $('abrirMonitor').addEventListener('click', () => abrirMonitor(true));
  $('abrirResultado').addEventListener('click', abrirResultado);
  $('mapaUF').innerHTML = ufs.filter(([cd]) => cd !== 'zz').map(([cd, nm]) => `<option value="${cd}">${nm}</option>`).join('');
  const destacar = (uf) => { S.mapaUF = uf; gravar('mapaUF', uf); renderMapa(); };
  $('mapaUF').addEventListener('change', (ev) => destacar(ev.target.value));
  $('mapaSoFeitos').addEventListener('change', (ev) => { mapaSoFeitos = ev.target.checked; renderMapa(); });
  $('mapa').addEventListener('click', (ev) => {
    const uf = ev.target.closest('path[data-uf]')?.dataset.uf;
    if (uf) destacar(uf);
  });
  $('mapaDetalhe').addEventListener('click', (ev) => {
    const uf = ev.target.closest('[data-abrir]')?.dataset.abrir;
    if (!uf) return;
    $('estUF').value = uf;
    $('estUF').dispatchEvent(new Event('change'));
    $('presAbr').value = uf;
    $('presAbr').dispatchEvent(new Event('change'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('resultado').addEventListener('click', (ev) => {
    if (ev.target === $('resultado') || ev.target.closest('[data-fechar]')) { $('resultado').close(); return; }
    const aba = ev.target.closest('[data-aba]')?.dataset.aba;
    if (aba && aba !== resAba) {
      resAba = aba;
      $('resultado').scrollTop = 0;
      abrirResultado();
    }
  });
  $('resultado').addEventListener('change', (ev) => {
    if (ev.target.id !== 'resUF') return;
    $('estUF').value = ev.target.value;
    $('estUF').dispatchEvent(new Event('change'));
    abrirResultado();
  });
  $('mCheia').addEventListener('click', telaCheia);
  $('mSair').addEventListener('click', fecharMonitor);
  // Os botões do monitor só aparecem quando alguém mexe o mouse ou toca na tela.
  for (const evento of ['mousemove', 'touchstart', 'click']) {
    $('monitor').addEventListener(evento, () => {
      $('monitor').classList.add('ativo');
      clearTimeout(mEsconde);
      mEsconde = setTimeout(() => $('monitor').classList.remove('ativo'), 3000);
    });
  }
  // Clicar no aviso (ou apertar Esc) passa para o próximo sem esperar o tempo acabar.
  $('aviso').addEventListener('click', proximoAviso);
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape') return;
    if (!$('aviso').hidden) proximoAviso();
    else if (monitorAberto() && !$('ficha').open) fecharMonitor();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && monitorAberto()) manterTelaLigada();
  });
  for (const origem of ['pres', 'est']) {
    $(origem).addEventListener('click', (ev) => {
      const sq = ev.target.closest('.cand')?.dataset.sq;
      if (!sq) return;
      ficha = { origem, sq };
      mostrarFicha();
    });
  }
  $('ficha').addEventListener('click', (ev) => {
    if (ev.target === $('ficha') || ev.target.closest('[data-fechar]')) $('ficha').close();
  });
  $('ufs').addEventListener('click', (ev) => {
    const uf = ev.target.closest('tr[data-uf]')?.dataset.uf;
    if (!uf) return;
    $('presAbr').value = uf;
    $('presAbr').dispatchEvent(new Event('change'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

// ---- Atualização automática do site: a cada minuto a página confere se foi publicada uma versão nova e recarrega sozinha.
async function conferirVersao() {
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const nova = (await r.text()).match(/const VERSAO = '([^']+)'/)?.[1];
    if (!nova || nova === VERSAO) return;
    // Não interrompe quem está em tela cheia ou com uma janela aberta: tenta de novo no próximo minuto.
    if (document.fullscreenElement || $('ficha').open || $('resultado').open) return;
    // Só tenta uma vez por versão, para não ficar recarregando se o navegador insistir na página antiga.
    if (ler('recarregouPara', '') === nova) return;
    gravar('recarregouPara', nova);
    location.replace(location.pathname + '?v=' + encodeURIComponent(nova) + location.hash);
  } catch {}
}

montarControles();
preencherMunicipios().then(atualizar);
carregarMapa();
setInterval(conferirVersao, 60000);
if (location.hash === '#monitor') abrirMonitor(false);
setInterval(() => {
  falta -= 1;
  if (falta <= 0) atualizar();
  $('contagem').textContent = `Próxima atualização em ${Math.max(falta, 0)} s`;
  if (monitorAberto()) $('mRelogio').textContent = new Date().toLocaleTimeString('pt-BR');
}, 1000);
</script>
